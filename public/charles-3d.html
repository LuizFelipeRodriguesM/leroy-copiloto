<title>Charles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #E7E7E7;
  --surface: #F3F3F3;
  --line: #DCDCDC;
  --fg: #151514;
  --muted: #6F6D68;
  --seg: #DADADA;
  --seg-on: #FFFFFF;
  --accent: #2F9C9C;
  --scrim: rgba(231, 231, 231, 0.96);
  --lift: 0 1px 2px rgba(20, 20, 18, 0.10);
  --font-display: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root, :root[data-theme="dark"] { color-scheme: light; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
.page {
  max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px;
  padding-block: 44px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-direction: column; gap: 8px; }
h1 { margin: 0; font: 600 clamp(32px, 5vw, 46px)/1 var(--font-display); letter-spacing: -0.035em; text-wrap: balance; }
.hint { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; }
.seg { display: inline-flex; background: var(--seg); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: 500 13px/1 var(--font-body); padding: 8px 13px; border-radius: 999px; white-space: nowrap;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--fg); box-shadow: var(--lift); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
.card canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; cursor: grab; touch-action: pan-y; }
.card canvas.dragging, .stage canvas.dragging { cursor: grabbing; }
.card .name { padding: 0 18px 16px; font: 500 15px/1.2 var(--font-body); letter-spacing: -0.01em; }
footer { color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 70ch; }
footer a { color: inherit; }
.stage {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage canvas { display: block; width: var(--stage-size, 480px); height: var(--stage-size, 480px); max-width: 100%; touch-action: none; cursor: grab; }
.stage h2 { margin: 0; font: 600 22px/1 var(--font-display); letter-spacing: -0.02em; }
.stage .toolbar { justify-content: center; }
.stage .close {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  border: 0; background: var(--seg); color: var(--fg); width: 40px; height: 40px; border-radius: 999px;
  font: 400 22px/1 var(--font-body); cursor: pointer;
}
.stage .straighten { border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--font-body); cursor: pointer; padding: 6px 10px; }
.stage .straighten:hover { color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 760px; }
.chips button {
  border: 0; background: var(--seg); color: var(--muted); cursor: pointer;
  font: 500 12.5px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; white-space: nowrap;
}
.chips button:hover { color: var(--fg); }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.swatches { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; max-width: 620px; }
.swatches .swatch {
  width: 28px; height: 28px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14);
}
.swatches .swatch[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
.swatches .swatch.custom { background: conic-gradient(#E5484D, #F2C94C, #25A56A, #53B9B9, #2F7BF6, #8B5CF6, #EC5FA0, #E5484D); position: relative; }
.swatches .swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatches .reset {
  border: 0; background: var(--seg); color: var(--muted); cursor: pointer;
  font: 500 12.5px/1 var(--font-body); padding: 8px 12px; border-radius: 999px;
}
.swatches .reset[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.error { color: var(--muted); font-size: 14px; }
html.embed, html.embed body { background: transparent !important; overflow: hidden; height: 100%; }
html.embed body > .page, html.embed body > .stage { display: none !important; }
html.embed #embed-canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); cursor: grab; touch-action: none; }
html.embed #embed-canvas.dragging { cursor: grabbing; }
@media (max-width: 520px) {
  .chips { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; max-width: 100%; scrollbar-width: none; padding-bottom: 2px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { border-radius: 18px; }
  .card .name { padding: 0 14px 12px; font-size: 14px; }
}
</style>

<div class="page">
  <header>
    <h1>Charles</h1>
    <p class="hint">Arraste pra girar em qualquer direção. Clique pra ver de perto.</p>
  </header>
  <div class="toolbar" id="toolbar"></div>
  <main class="grid" id="grid" aria-label="Mascotes"></main>
  <footer>

  </footer>
</div>

  <button class="straighten" id="stage-straighten" type="button">Endireitar</button>
</div>

function setArc(geometry, mark, surfaceAt) {
  const arr = geometry.attributes.position.array;
  const { x0, y0, qx, qy, x1, y1, stroke } = mark;
  const half = stroke / 2;
  const point = (t) => [
    (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * qx + t * t * x1,
    (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * qy + t * t * y1,
  ];
  const tangent = (t) => {
    const dx = 2 * (1 - t) * (qx - x0) + 2 * t * (x1 - qx);
    const dy = 2 * (1 - t) * (qy - y0) + 2 * t * (y1 - qy);
    const l = Math.hypot(dx, dy) || 1;
    return [dx / l, dy / l];
  };
  for (let m = 0; m < ARC_M; m++) {
    const t = m / (ARC_M - 1);
    const [px, py] = point(t);
    const [tx, ty] = tangent(t);
    putVertex(arr, 2 * m, surfaceAt, px - ty * half, py + tx * half);
    putVertex(arr, 2 * m + 1, surfaceAt, px + ty * half, py - tx * half);
  }
  [[0, -1], [1, 1]].forEach(([t, dir], cap) => {
    const base = 2 * ARC_M + cap * (1 + CAP);
    const [px, py] = point(t);
    const [tx, ty] = tangent(t);
    putVertex(arr, base, surfaceAt, px, py);
    for (let i = 0; i < CAP; i++) {
      const th = (i / (CAP - 1)) * Math.PI;
      const nx = -ty * Math.cos(th) + dir * tx * Math.sin(th);
      const ny = tx * Math.cos(th) + dir * ty * Math.sin(th);
      putVertex(arr, base + 1 + i, surfaceAt, px + nx * half, py + ny * half);
    }
  });
  geometry.attributes.position.needsUpdate = true;
}

function measureHead(prepared, cfg, surfaceAt) {
  const multi = prepared.vol.parts.length > 1;
  const head = multi
    ? OBA.partField(prepared, prepared.vol.eyePart)
    : prepared.field;
  const field = prepared.field;
  const marks = OBA.eyeMarks3d(prepared, NEUTRAL_POSE)
    .slice()
    .sort((p, q) => p.cx - q.cx);
  const [a, b] = marks;
  const ax = (a.cx + b.cx) / 2,
    ey = (a.cy + b.cy) / 2,
    eh = a.height / 2;
  const topAt = (x) => {
    for (let y = 0; y <= 100; y += 0.2) if (head(x, y) >= 0) return y;
    return 50;
  };
  const bottomAt = (x) => {
    for (let y = 100; y >= 0; y -= 0.2) if (field(x, y) >= 0) return y;
    return 50;
  };
  const span = (y, x = ax) => {
    if (head(x, y) < 0) return { l: x, r: x, w: 0 };
    let l = x,
      r = x;
    while (l > 0 && head(l - 0.25, y) >= 0) l -= 0.25;
    while (r < 100 && head(r + 0.25, y) >= 0) r += 0.25;
    return { l, r, w: r - l };
  };
  return {
    ax,
    ey,
    eh,
    ew: a.width,
    hs: (b.cx - a.cx) / 2,
    eyes: [a, b],
    top: topAt(ax),
    eyeTop: ey - eh,
    eyeBottom: ey + eh,
    bottom: bottomAt(ax),
    span,
    surfaceAt,
    mid: (x) => (cfg.bend ? -cfg.bend * 50 * ((x - 50) / 50) ** 2 : 0),
    flat: prepared.vol.parts[prepared.vol.eyePart]?.kind === "inflate",
    faceZ: surfaceAt(ax, ey),
  };
}

function conformGeometry(source, x0, y0, lift, surfaceAt, maxEdge = 1.2) {
  ["uv", "normal"].forEach((name) => source.deleteAttribute(name));
  let geometry = mergeVertices(source, 1e-4);
  source.dispose();
  geometry.computeVertexNormals();
  geometry = refineGeometry(geometry, maxEdge);
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const fx = x0 + pos.getX(i),
      fy = y0 - pos.getY(i);
    pos.setXYZ(
      i,
      toWorldX(fx),
      toWorldY(fy),
      (pos.getZ(i) + lift + surfaceAt(fx, fy)) * UNIT,
    );
  }
  geometry.deleteAttribute("normal");
  geometry.computeVertexNormals();
  return geometry;
}

const lathe = (pts, segments = 56) =>
  new THREE.LatheGeometry(
    pts.map(([r, y]) => new THREE.Vector2(r, y)),
    segments,
  );

function brimGeometry(rIn, rOut, t, rise = () => 0) {
  const pts = [];
  const n = 16;
  for (let i = 0; i <= n; i++) {
    const r = rIn + ((rOut - rIn) * i) / n;
    pts.push([r, rise(r) - t / 2]);
  }
  for (let k = 1; k < 8; k++) {
    const a = -Math.PI / 2 + (k / 8) * Math.PI;
    pts.push([
      rOut + Math.cos(a) * t * 0.5,
      rise(rOut) + Math.sin(a) * t * 0.5,
    ]);
  }
  for (let i = n; i >= 0; i--) {
    const r = rIn + ((rOut - rIn) * i) / n;
    pts.push([r, rise(r) + t / 2]);
  }
  return lathe(pts, 96);
}

function deform(geometry, fn) {
  const pos = geometry.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    fn(v);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geometry.computeVertexNormals();
  return geometry;
}

const softExtrude = (shape, depth, bevel, segments = 4) => {
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelThickness: bevel,
    bevelSize: bevel * 0.9,
    bevelSegments: segments,
    curveSegments: 16,
  });
  geometry.translate(0, 0, bevel);
  return geometry;
};

function mirrored(draw) {
  const pts = [];
  const right = new THREE.Shape();
  draw(right, 1);
  const half = right.getPoints(24);
  half.forEach((p) => pts.push(p));
  for (let i = half.length - 2; i > 0; i--)
    pts.push(new THREE.Vector2(-half[i].x, half[i].y));
  return new THREE.Shape(pts);
}

function hatSeat(h, grip) {
  const ref = h.span(h.top + 8).w || 20;
  const rc = clamp(ref * 0.46, 10, 19);
  let y = h.top;
  while (y < h.eyeTop - 4 && h.span(y).w < rc * 1.7) y += 0.25;
  const { l, r, w } = h.span(y);
  const x = w ? (l + r) / 2 : h.ax;
  const depth = Math.max(0, h.surfaceAt(x, y) - h.mid(x));
  const fit = clamp(depth * 0.8, rc, 22);
  return { x, y, s: fit / grip, zs: clamp((depth + 1.5) / fit, 1, 1.3) };
}

function hat(kit, grip, tilt, build, maxWidth, sink = 0) {
  const seat = hatSeat(kit.h, grip);
  if (maxWidth) seat.s = Math.min(seat.s, maxWidth);
  const g = kit.piece(seat.x, seat.y + sink * seat.s, kit.h.mid(seat.x), tilt, seat.s);
  g.scale.z *= seat.zs;
  build(g);
}

function mustache(kit, big) {

function sweepGeometry(curve, widthAt, heightAt, groove = 0, segments = 64, radial = 40) {
  const X = new THREE.Vector3(1, 0, 0);
  const pos = [];
  const idx = [];
  for (let i = 0; i <= segments; i++) {
    const u = i / segments;
    const p = curve.getPointAt(u);
    const n = new THREE.Vector3().crossVectors(curve.getTangentAt(u), X).normalize();
    const a = widthAt(u), b = heightAt(u);
    for (let j = 0; j < radial; j++) {
      const th = (j / radial) * Math.PI * 2;
      const k = 1 + groove * Math.cos(th * 7);
      pos.push(
        p.x + a * k * Math.cos(th),
        p.y + n.y * b * k * Math.sin(th),
        p.z + n.z * b * k * Math.sin(th),
      );
    }
  }
  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * radial + j, b = i * radial + ((j + 1) % radial);
      idx.push(a, a + radial, b, b, a + radial, b + radial);
    }
  }
  [0, segments].forEach((i) => {
    const p = curve.getPointAt(i / segments);
    const center = pos.length / 3;
    pos.push(p.x, p.y, p.z);
    for (let j = 0; j < radial; j++) idx.push(center, i * radial + j, i * radial + ((j + 1) % radial));
  });
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geometry.setIndex(idx);
  geometry.computeVertexNormals();
  return geometry;
}

const ACC_LEAN = { tri: 1 };

function buildAccessory(id, head, seed, botId) {
  const root = new THREE.Group();
  const pops = [];
  const list = [];
  const builder = ACCESSORY_BUILDERS[id];
  if (!builder) return { id: "none", root, pops, list };
  const kit = {
    h: head,
    side: ACC_LEAN[botId] ?? (seed % 2 ? 1 : -1),
    piece(x, y, z, tilt = 0, s = 1) {
      const pop = new THREE.Group();
      pop.position.copy(anchorAt(x, y, z));
      const inner = new THREE.Group();
      inner.scale.setScalar(UNIT * s);
      inner.rotation.z = tilt;
      pop.add(inner);
      root.add(pop);
      pops.push(pop);
      return inner;
    },
    world(x, y) {
      const pop = new THREE.Group();
      pop.position.copy(anchorAt(x, y, head.surfaceAt(x, y)));
      const inner = new THREE.Group();
      inner.position.copy(pop.position).negate();
      pop.add(inner);
      root.add(pop);
      pops.push(pop);
      return inner;
    },
    mesh(parent, geometry, tone) {
      const vertexColors = !!geometry.attributes.color;
      const lit = new THREE.MeshLambertMaterial({ side: THREE.DoubleSide, vertexColors });
      const flat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, vertexColors });
      const mesh = new THREE.Mesh(geometry, state.flat ? flat : lit);
      mesh.userData = { lit, flat, tone };
      parent.add(mesh);
      list.push(mesh);
      return mesh;
    },
    conform(geometry, x0, y0, lift, tone, surface = head.surfaceAt) {
      return kit.mesh(
        kit.world(x0, y0),
        conformGeometry(geometry, x0, y0, lift, surface),
        tone,
      );
    },
  };
  builder(kit);
  return { id, root, pops, list };
}

function disposeAccessory(accessory) {
  accessory.root.removeFromParent();
  accessory.list.forEach((mesh) => {
    mesh.geometry.dispose();
    mesh.userData.lit.dispose();
    mesh.userData.flat.dispose();
  });
}

function accessoryFit(meshes, accessory, bodyOffset) {
  const bodyBox = new THREE.Box3();
  meshes.forEach((mesh) => {
    if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
    bodyBox.union(mesh.geometry.boundingBox);
  });
  if (!accessory.list.length) return { scale: 1, cx: 0, cy: 0 };
  accessory.root.updateMatrixWorld(true);
  const union = bodyBox
    .clone()
    .union(new THREE.Box3().setFromObject(accessory.root));
  const half =
    Math.max(union.max.x - union.min.x, union.max.y - union.min.y) / 2;
  const center = union.getCenter(new THREE.Vector3()).add(bodyOffset);
  const bodyCenter = bodyBox.getCenter(new THREE.Vector3()).add(bodyOffset);
  return {
    scale: Math.min(1, 0.86 / half),
    cx: center.x - bodyCenter.x,
    cy: center.y - bodyCenter.y,
  };
}

let accChoice = {};
try {
  accChoice = JSON.parse(localStorage.getItem("charles-acc-v1") || "{}") || {};
} catch {
  accChoice = {};
}
const accFor = (id) =>
  EMBED_ACC && ACC_LIST.some(([key]) => key === EMBED_ACC)
    ? EMBED_ACC
    : ACC_LIST.some(([key]) => key === accChoice[id])
    ? accChoice[id]
    : (DEFAULT_ACC[id] ?? "none");

function setAccessory(bot, id) {
  disposeAccessory(bot.accessory);
  bot.accessory = buildAccessory(id, bot.head, bot.prepared.seed, bot.cfg.def.id);
  bot.accFit = accessoryFit(bot.meshes, bot.accessory, bot.bodyOffset);
  bot.body.add(bot.accessory.root);
  bot.accK = reduced ? 1 : 0;
  paintBot(bot);
  accChoice[bot.cfg.def.id] = id;
  try {
    localStorage.setItem("charles-acc-v1", JSON.stringify(accChoice));
  } catch {
  }
}

function buildBot(cfg) {
  const prepared = OBA.prepare3d(cfg.def, cfg.depth ?? 6, !!cfg.revolve, cfg.bevel ?? 1);
  const bounds = prepared.vol.bounds;
  const cx = (bounds.minX + bounds.maxX) / 2, cy = (bounds.minY + bounds.maxY) / 2;

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, AMBIENT));
  const sun = new THREE.DirectionalLight(0xffffff, SUN);
  sun.position.set(-1.6, 2.4, 2.6);
  scene.add(sun);

  const squash = new THREE.Group();
  const user = new THREE.Group();
  const roll = new THREE.Group();
  const pitch = new THREE.Group();
  const yaw = new THREE.Group();
  const frame = new THREE.Group();
  const body = new THREE.Group();
  scene.add(squash);
  squash.add(user);
  user.add(roll);
  roll.add(pitch);
  pitch.add(yaw);
  yaw.add(frame);
  frame.add(body);
  body.position.set(-(cx - 50) / 50, (cy - 50) / 50, 0);

  const palette = cfg.colors ?? [cfg.color];
  const meshes = prepared.vol.parts.map((part, i) => {
    const color = new THREE.Color(palette[i % palette.length]);
    const lit = new THREE.MeshLambertMaterial({ color });
    const flat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(bendGeometry(partGeometry(part), cfg.bend ?? 0), state.flat ? flat : lit);
    mesh.userData = { lit, flat, base: palette[i % palette.length] };
    body.add(mesh);
    return mesh;
  });

  const eyeMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  });
  const eyes = [0, 1].map(() => {
    const pill = new THREE.Mesh(pillGeometry(), eyeMaterial);
    const arc = new THREE.Mesh(arcGeometry(), eyeMaterial);
    pill.frustumCulled = false;
    arc.frustumCulled = false;
    body.add(pill, arc);
    return { pill, arc };
  });

  const surfaceAt = bentSurface(makeSurfaceLookup(prepared), cfg.bend ?? 0);
  const head = measureHead(prepared, cfg, surfaceAt);
  const accessory = buildAccessory(accFor(cfg.def.id), head, prepared.seed, cfg.def.id);
  const accFit = accessoryFit(meshes, accessory, body.position);
  body.add(accessory.root);

  const bot = {
    cfg, prepared, scene, squash, user, roll, pitch, yaw, frame, meshes, eyes, eyeMaterial,
    accessory, accFit, accK: state.acc ? 1 : 0,
    surfaceAt, head, body, bodyOffset: body.position.clone(),
    baseY: -(bounds.maxY - cy) / 50,
    vel: new THREE.Vector2(),
    dragging: false,
    spinHold: 0,
    straightening: false,
    thinkLevel: 0,
  };
  paintBot(bot);
  return bot;
}

const BODY_COLORS = [
  ['#53B9B9', 'Turquesa'], ['#2B6A6A', 'Petróleo'], ['#25A56A', 'Verde'], ['#86C66A', 'Verde-claro'],
  ['#F2C94C', 'Amarelo'], ['#F2A93B', 'Mostarda'], ['#EE6A2C', 'Laranja'], ['#E5484D', 'Vermelho'],
  ['#EC5FA0', 'Rosa'], ['#F59BBE', 'Rosa-claro'], ['#8B5CF6', 'Roxo'], ['#5B4DE6', 'Anil'],
  ['#2F7BF6', 'Azul'], ['#7DB3E8', 'Azul-claro'], ['#FAFAF7', 'Branco'], ['#16161A', 'Preto'],
];
const COLOR_KEY = 'charles-color-v2';
let colorChoice = {};
try { colorChoice = JSON.parse(localStorage.getItem(COLOR_KEY) || '{}') || {}; } catch { colorChoice = {}; }
const isHex = (v) => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const chosenColor = (bot) => (!EMBED && isHex(colorChoice[bot.cfg.def.id]) ? colorChoice[bot.cfg.def.id] : null);
const luminance = (hex) => { const c = new THREE.Color(hex); return 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b; };

function bodyPalette(bot) {
  const original = bot.cfg.colors ?? [bot.cfg.color];
  const chosen = chosenColor(bot);
  if (!chosen) return bot.meshes.map((_, i) => original[i % original.length]);
  const hsl = {};
  new THREE.Color(chosen).getHSL(hsl);
  return bot.meshes.map((_, i) => {
    if (bot.meshes.length === 1 || i === bot.prepared.vol.eyePart) return chosen;
    const up = i % 2 === 1;
    const tone = new THREE.Color().setHSL((hsl.h + (up ? 0.025 : -0.025) + 1) % 1, hsl.s, clamp(hsl.l + (up ? 0.12 : -0.1), 0.08, 0.92));
    return `#${tone.getHexString()}`;
  });
}

function setBodyColor(bot, hex) {
  if (hex) colorChoice[bot.cfg.def.id] = hex;
  else delete colorChoice[bot.cfg.def.id];
  try { localStorage.setItem(COLOR_KEY, JSON.stringify(colorChoice)); } catch { }
  paintBot(bot);
}

function paintBot(bot) {
  const palette = bodyPalette(bot);
  bot.meshes.forEach((mesh, i) => {
    mesh.userData.lit.color.set(palette[i]);
    mesh.userData.flat.color.set(palette[i]);
    mesh.material = state.flat ? mesh.userData.flat : mesh.userData.lit;
  });
  const face = palette[Math.min(bot.prepared.vol.eyePart, palette.length - 1)];
  const darkBody = luminance(face) < 0.02;
  bot.accessory.list.forEach((mesh) => {
    const { tone } = mesh.userData;
    const hex = darkBody && tone === 'ink' ? '#ECE9E1' : darkBody && tone === 'band' ? '#C8C3B7' : ACC_TONES[tone];
    mesh.userData.lit.color.set(hex);
    mesh.userData.flat.color.set(hex);
    mesh.material = state.flat ? mesh.userData.flat : mesh.userData.lit;
  });
  bot.eyeMaterial.color.set(luminance(face) > 0.55 ? '#16161A' : '#FFFFFF');
}

function rotateBot(bot, ax, ay) {
  qa.setFromAxisAngle(AXIS_Y, ax);
  qb.setFromAxisAngle(AXIS_X, ay);
  bot.user.quaternion.premultiply(qa).premultiply(qb).normalize();
}

let pointer = null;
window.addEventListener('pointermove', (e) => { pointer = { x: e.clientX, y: e.clientY }; }, { passive: true });

function updateBot(bot, t, dt, viewEl) {
  const moodT = (t - moodAt) / 0.5;
  const blend = moodT < 1 ? { from: moodFrom, t: Math.max(0, moodT) } : undefined;
  let gaze;
  let restWeight = 1;
  if (state.follow && pointer && viewEl) {
    const r = viewEl.getBoundingClientRect();
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    gaze = {
      x: clamp((pointer.x - (r.left + r.width / 2)) / (r.width * 1.1)),
      y: clamp((pointer.y - (r.top + r.height / 2)) / (r.height * 1.1)),
      weight: 1,
    };
    restWeight = 0.2;
  }
  const pose = OBA.computePose({
    seed: bot.prepared.seed,
    time: t,
    motion: state.mood,
    gaze,
    reducedMotion: reduced,
    view: { yaw: REST_VIEW.yaw * restWeight, pitch: REST_VIEW.pitch * restWeight },
    blend,
  });

  bot.thinkLevel += ((state.mood === 'thinking' ? 1 : 0) - bot.thinkLevel) * Math.min(1, dt * 3);
  const wobble = reduced ? 0 : bot.thinkLevel;
  bot.yaw.rotation.y = pose.yaw + wobble * 0.34 * Math.sin(t * 1.9 + (bot.prepared.seed % 7));
  bot.pitch.rotation.x = -pose.pitch - wobble * 0.12 * Math.sin(t * 1.4 + (bot.prepared.seed % 5));
  bot.roll.rotation.z = (-pose.roll * Math.PI) / 180;
  bot.squash.scale.set(pose.sx, pose.sy, pose.sx);
  bot.squash.position.y = bot.baseY * (1 - pose.sy) - pose.lift / 50;

  if (bot.straightening) {
    bot.user.quaternion.slerp(IDENTITY, Math.min(1, dt * 7));
    if (bot.user.quaternion.angleTo(IDENTITY) < 0.004) {
      bot.user.quaternion.identity();
      bot.straightening = false;
    }
  } else if (!bot.dragging) {
    if (bot.vel.lengthSq() > 1e-8) {
      rotateBot(bot, bot.vel.x, bot.vel.y);
      bot.vel.multiplyScalar(Math.pow(0.9, dt * 60));
    }
    bot.spinHold = Math.max(0, bot.spinHold - dt);
    if (state.spin && bot.spinHold === 0) rotateBot(bot, dt * 0.8, 0);
  }

  const marks = OBA.eyeMarks3d(bot.prepared, pose);
  marks.forEach((mark, i) => {
    const eye = bot.eyes[i];
    if (mark.shape === 'pill') {
      setPill(eye.pill.geometry, mark, bot.surfaceAt);
      eye.pill.visible = true;
      eye.arc.visible = false;
    } else {
      setArc(eye.arc.geometry, mark, bot.surfaceAt);
      eye.arc.visible = true;
      eye.pill.visible = false;
    }
  });

  updateAccessory(bot, t, dt);
}

function updateAccessory(bot, t, dt) {
  const target = state.acc ? 1 : 0;
  bot.accK = reduced ? target : bot.accK + Math.sign(target - bot.accK) * Math.min(Math.abs(target - bot.accK), dt / 0.45);
  const k = bot.accK;
  const { accessory, accFit, frame } = bot;
  accessory.root.visible = k > 0.001;
  const pop = Math.max(0, easeOutBack(k));
  accessory.pops.forEach((group) => group.scale.setScalar(pop));
  const s = 1 + (accFit.scale - 1) * k;
  frame.scale.setScalar(s);
  frame.position.set(-accFit.cx * k * s, -accFit.cy * k * s, 0);
}

function draw(bot, ctx, px) {
  renderer.render(bot.scene, camera);
  ctx.clearRect(0, 0, px, px);
  ctx.drawImage(renderer.domElement, 0, 0, px, px, 0, 0, px, px);
}

const CONTROLS = [
  { key: 'mood', label: 'Humor', options: [['idle', 'Tranquilo'], ['thinking', 'Pensando'], ['happy', 'Feliz']] },
  { key: 'spin', label: 'Movimento', options: [[true, 'Girando'], [false, 'Parados']] },
  { key: 'flat', label: 'Visual', options: [[false, 'Volume'], [true, 'Chapado']] },
  { key: 'follow', label: 'Olhar', options: [[false, 'Olhar livre'], [true, 'Segue o mouse']] },
  { key: 'acc', label: 'Acessório', options: [[true, 'Com acessório'], [false, 'Sem acessório']] },
];
const segButtons = [];

function setControl(key, value) {
  if (state[key] === value) return;
  if (key === 'mood') {
    moodFrom = state.mood;
    moodAt = performance.now() / 1000;
  }
  state[key] = value;
  if (key === 'flat') bots.forEach((bot) => bot && paintBot(bot));
  if (key === 'spin' && !value) bots.forEach((bot) => { if (bot) { bot.vel.set(0, 0); bot.straightening = true; } });
  segButtons.forEach(({ button, key: k, value: v }) => button.setAttribute('aria-pressed', String(state[k] === v)));
}

function renderControls(container) {
  CONTROLS.forEach(({ key, label, options }) => {
    const group = document.createElement('div');
    group.className = 'seg';
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', label);
    options.forEach(([value, text]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = text;
      button.setAttribute('aria-pressed', String(state[key] === value));
      button.addEventListener('click', () => setControl(key, value));
      segButtons.push({ button, key, value });
      group.append(button);
    });
    container.append(group);
  });
}
renderControls(document.getElementById('toolbar'));
renderControls(document.getElementById('stage-toolbar'));

function attachDrag(el, getBot, onTap, onSpin) {
  let active = null;
  el.addEventListener('pointerdown', (e) => {
    const bot = getBot();
    if (!bot) return;
    active = { id: e.pointerId, lx: e.clientX, ly: e.clientY, moved: 0, at: performance.now(), bot };
    el.setPointerCapture(e.pointerId);
    bot.vel.set(0, 0);
    bot.dragging = true;
    bot.straightening = false;
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!active || e.pointerId !== active.id) return;
    const dx = e.clientX - active.lx, dy = e.clientY - active.ly;
    active.lx = e.clientX;
    active.ly = e.clientY;
    active.moved += Math.abs(dx) + Math.abs(dy);
    const k = 3.4 / Math.max(120, el.clientWidth);
    rotateBot(active.bot, dx * k, dy * k);
    active.bot.vel.set(active.bot.vel.x * 0.4 + dx * k * 0.6, active.bot.vel.y * 0.4 + dy * k * 0.6);
  });
  const end = (e) => {
    if (!active || e.pointerId !== active.id) return;
    const { bot, moved, at } = active;
    active = null;
    bot.dragging = false;
    bot.spinHold = 1.6;
    el.classList.remove('dragging');
    if (e.type === 'pointerup' && moved < 6 && performance.now() - at < 450) {
      bot.vel.set(0, 0);
      onTap?.(bot);
    } else if (moved >= 6) {
      onSpin?.(bot);
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

const grid = document.getElementById('grid');
const bots = new Array(BOTS.length).fill(null);
const cards = BOTS.map((cfg, i) => {
  const card = document.createElement('article');
  card.className = 'card';
  const canvas = document.createElement('canvas');
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', `${cfg.def.name}, mascote 3D`);
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = cfg.def.name;
  card.append(canvas, name);
  grid.append(card);
  const entry = { canvas, ctx: canvas.getContext('2d'), visible: true, index: i };
  attachDrag(canvas, () => bots[i], (bot) => openStage(bot, i));
  return entry;
});

let cardPx = 0;
function measure() {
  const css = cards[0].canvas.clientWidth || 240;
  const px = Math.max(64, Math.round(css * Math.min(window.devicePixelRatio || 1, 2)));
  if (px === cardPx) return;
  cardPx = px;
  cards.forEach(({ canvas }) => { canvas.width = px; canvas.height = px; });
}
new ResizeObserver(measure).observe(grid);
measure();

const io = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    const card = cards.find((c) => c.canvas === entry.target);
    if (card) card.visible = entry.isIntersecting;
  });
}, { rootMargin: '120px' });
cards.forEach(({ canvas }) => io.observe(canvas));

const stageEl = document.getElementById('stage');
const stageCanvas = document.getElementById('stage-canvas');
const stageCtx = stageCanvas.getContext('2d');
const stageName = document.getElementById('stage-name');
const stage = { open: false, index: -1, px: 0 };

function sizeStage() {
  const css = Math.floor(Math.min(window.innerWidth - 32, window.innerHeight * 0.46, 600));
  stageCanvas.style.setProperty('--stage-size', `${css}px`);
  const px = Math.round(css * Math.min(window.devicePixelRatio || 1, 2));
  stage.px = px;
  stageCanvas.width = px;
  stageCanvas.height = px;
}

const accChips = document.getElementById('stage-acc');
const accButtons = ACC_LIST.map(([id, label]) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.addEventListener('click', () => {
    const bot = bots[stage.index];
    if (!bot) return;
    if (!state.acc && id !== 'none') setControl('acc', true);
    if (bot.accessory.id !== id) setAccessory(bot, id);
    syncAccChips();
  });
  accChips.append(button);
  return { id, button };
});
function syncAccChips() {
  const bot = bots[stage.index];
  const current = bot ? bot.accessory.id : 'none';
  accButtons.forEach(({ id, button }) => button.setAttribute('aria-pressed', String(id === current)));
}

const colorRow = document.getElementById('stage-color');
const colorButtons = BODY_COLORS.map(([hex, label]) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'swatch';
  button.style.background = hex;
  button.setAttribute('aria-label', label);
  button.title = label;
  button.addEventListener('click', () => {
    const bot = bots[stage.index];
    if (!bot) return;
    setBodyColor(bot, hex);
    syncColors();
  });
  colorRow.append(button);
  return { hex, button };
});
const customSwatch = document.createElement('label');
customSwatch.className = 'swatch custom';
customSwatch.title = 'Outra cor';
const customInput = document.createElement('input');
customInput.type = 'color';
customInput.setAttribute('aria-label', 'Outra cor');
customInput.addEventListener('input', () => {
  const bot = bots[stage.index];
  if (!bot) return;
  setBodyColor(bot, customInput.value.toUpperCase());
  syncColors();
});
customSwatch.append(customInput);
const resetColor = document.createElement('button');
resetColor.type = 'button';
resetColor.className = 'reset';
resetColor.textContent = 'Cor original';
resetColor.addEventListener('click', () => {
  const bot = bots[stage.index];
  if (!bot) return;
  setBodyColor(bot, null);
  syncColors();
});
colorRow.append(customSwatch, resetColor);
function syncColors() {
  const bot = bots[stage.index];
  const chosen = bot ? chosenColor(bot) : null;
  const known = colorButtons.some(({ hex }) => hex === chosen);
  colorButtons.forEach(({ hex, button }) => button.setAttribute('aria-pressed', String(hex === chosen)));
  customSwatch.toggleAttribute('aria-pressed', false);
  customSwatch.style.outline = chosen && !known ? '2px solid var(--fg)' : '';
  customSwatch.style.outlineOffset = '2px';
  resetColor.setAttribute('aria-pressed', String(!chosen));
  customInput.value = (chosen ?? bot?.cfg.colors?.[0] ?? bot?.cfg.color ?? '#53B9B9').toLowerCase();
}

let lastFocus = null;
function openStage(bot, index) {
  lastFocus = document.activeElement;
  stage.open = true;
  stage.index = index;
  stageName.textContent = bot.cfg.def.name;
  stageCanvas.setAttribute('aria-label', `${bot.cfg.def.name}, mascote 3D`);
  stageEl.hidden = false;
  syncAccChips();
  syncColors();
  sizeStage();
  document.getElementById('stage-close').focus();
}
function closeStage() {
  if (!stage.open) return;
  stage.open = false;
  stageEl.hidden = true;
  lastFocus?.focus?.();
}
attachDrag(stageCanvas, () => (stage.open ? bots[stage.index] : null));
stageCanvas.addEventListener('dblclick', () => { const bot = bots[stage.index]; if (bot) bot.straightening = true; });
document.getElementById('stage-straighten').addEventListener('click', () => { const bot = bots[stage.index]; if (bot) bot.straightening = true; });
document.getElementById('stage-close').addEventListener('click', closeStage);
stageEl.addEventListener('click', (e) => { if (e.target === stageEl) closeStage(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeStage(); });
window.addEventListener('resize', () => { if (stage.open) sizeStage(); });

const embed = { canvas: null, ctx: null, px: 0, shown: false };
if (EMBED) {
  const canvas = document.createElement('canvas');
  canvas.id = 'embed-canvas';
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', 'Charles, o copiloto da Leroy Merlin');
  document.body.append(canvas);
  embed.canvas = canvas;
  embed.ctx = canvas.getContext('2d');
  const sizeEmbed = () => {
    const css = Math.floor(Math.min(window.innerWidth, window.innerHeight));
    canvas.style.width = `${css}px`;
    canvas.style.height = `${css}px`;
    embed.px = Math.max(64, Math.round(css * Math.min(window.devicePixelRatio || 1, 2)));
    canvas.width = embed.px;
    canvas.height = embed.px;
  };
  sizeEmbed();
  window.addEventListener('resize', sizeEmbed);
  let hopTimer = 0;
  const hop = () => {
    const before = state.mood === 'happy' ? 'idle' : state.mood;
    setControl('mood', 'happy');
    clearTimeout(hopTimer);
    hopTimer = setTimeout(() => setControl('mood', before), 1600);
  };
  const notify = (kind) => window.parent?.postMessage({ type: 'charles:poked', kind }, location.origin);
  attachDrag(canvas, () => bots[0], () => { hop(); notify('tap'); }, () => notify('spin'));
  window.addEventListener('message', (event) => {
    if (event.origin !== location.origin) return;
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'charles:pointer' && Number.isFinite(data.x) && Number.isFinite(data.y)) {
      pointer = { x: data.x, y: data.y };
    } else if (data.type === 'charles:mood' && ['idle', 'thinking', 'happy'].includes(data.mood)) {
      setControl('mood', data.mood);
    } else if (data.type === 'charles:hello') {
      window.parent?.postMessage({ type: 'charles:ready' }, location.origin);
      if (embed.shown) window.parent?.postMessage({ type: 'charles:shown' }, location.origin);
    } else if (data.type === 'charles:hop') {
      hop();
    }
  });
  window.parent?.postMessage({ type: 'charles:ready' }, location.origin);
}

let buildCursor = 0;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;
  if (buildCursor < BOTS.length) {
    try {
      bots[buildCursor] = buildBot(BOTS[buildCursor]);
    } catch (err) {
      console.error('bot', BOTS[buildCursor].def.id, err);
    }
    buildCursor++;
  }
  if (stage.open) {
    const bot = bots[stage.index];
    if (bot) {
      useSize(stage.px);
      updateBot(bot, t, dt, stageCanvas);
      draw(bot, stageCtx, stage.px);
    }
  } else if (EMBED) {
    const bot = bots[0];
    if (bot && embed.px) {
      useSize(embed.px);
      updateBot(bot, t, dt, embed.canvas);
      draw(bot, embed.ctx, embed.px);
      if (!embed.shown) {
        embed.shown = true;
        window.parent?.postMessage({ type: 'charles:shown' }, location.origin);
      }
    }
  } else if (cardPx) {
    useSize(cardPx);
    cards.forEach((card, i) => {
      const bot = bots[i];
      if (!bot || !card.visible) return;
      updateBot(bot, t, dt, card.canvas);
      draw(bot, card.ctx, cardPx);
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
